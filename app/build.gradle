apply plugin: 'com.android.application'

android {
    namespace 'com.evoia.app'
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.evoia.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':capacitor-android')
}

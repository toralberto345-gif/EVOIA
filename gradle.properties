http://localhost:8159/index.html<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGMA CHAT AI</title>

    <style>
      body {
        margin: 0;
        font-family: monospace;
        background: #000;
        color: #00ff88;
      }

      #chat {
        height: 90vh;
        overflow: auto;
        padding: 10px;
      }

      .msg {
        margin: 5px 0;
      }

      .user {
        color: white;
      }

      .ai {
        color: #00ff88;
      }

      #inputBox {
        width: 100%;
        display: flex;
      }

      input {
        flex: 1;
        padding: 10px;
        background: black;
        color: #00ff88;
        border: 1px solid #00ff88;
      }

      button {
        background: #00ff88;
        border: none;
        padding: 10px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="chat"></div>

    <div id="inputBox">
      <input id="text" placeholder="Escribe a SIGMA..." />
      <button onclick="send()">➤</button>
    </div>

    <script>
      let chat = document.getElementById("chat");

      function addMsg(text, cls) {
        chat.innerHTML += `<div class='msg ${cls}'>${text}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }

      function send() {
        let input = document.getElementById("text");
        let text = input.value;
        input.value = "";

        addMsg("TU: " + text, "user");

        setTimeout(() => {
          let reply = generateAI(text);
          addMsg("SIGMA: " + reply, "ai");
        }, 500);
      }

      let evo = 0;

      function generateAI(text) {
        evo++;

        if (text.toLowerCase().includes("hola")) {
          return "Hola. Sistema SIGMA activo. EVOLUTION " + evo;
        }

        if (text.toLowerCase().includes("qué eres")) {
          return "Soy SIGMA AI, interfaz neural en desarrollo.";
        }

        return "Procesando patrón: " + text + " | EVOLUTION " + evo;
      }
    </script>
  </body>
</html>

